<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Web for Codex</title>
  <desc id="desc">A native bridge that brings ChatGPT Web models into the Codex workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2838"/>
      <stop offset="0.55" stop-color="#111A24"/>
      <stop offset="1" stop-color="#0B1219"/>
    </linearGradient>
    <linearGradient id="signal" x1="135" y1="108" x2="360" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8E7F6"/>
      <stop offset="1" stop-color="#5B9FBE"/>
    </linearGradient>
    <linearGradient id="card" x1="940" y1="130" x2="1460" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F3040" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#101922" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#D8EEF6" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="38" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="558" rx="37" fill="none" stroke="#D9EDF5" stroke-opacity="0.13" stroke-width="2"/>
  <rect width="1600" height="560" rx="38" fill="url(#grid)"/>
  <circle cx="245" cy="255" r="175" fill="#5FA8C8" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="1280" cy="260" r="210" fill="#5FA8C8" fill-opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(112 107)">
    <rect width="188" height="188" rx="44" fill="#15222E" stroke="#D9EDF5" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M48 67 94 40l46 27v63l-46 27-46-27V67Z" fill="none" stroke="url(#signal)" stroke-linejoin="round" stroke-width="12"/>
    <path d="m69 82 25 15 25-15M94 97v31M69 82v30l25 15 25-15V82" fill="none" stroke="#EAF7FB" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
    <circle cx="94" cy="64" r="6" fill="#A7DBED"/>
  </g>

  <text x="336" y="158" fill="#9BC8DA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="650" letter-spacing="3.5">CHATGPT WEB FOR CODEX</text>
  <text x="336" y="215" fill="#F4FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="56" font-weight="760" letter-spacing="-1.8">Your ChatGPT models.</text>
  <text x="336" y="274" fill="#F4FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="56" font-weight="760" letter-spacing="-1.8">Inside Codex.</text>
  <text x="336" y="319" fill="#B9CAD3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="450">Choose like a native model. Keep Codex in control.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="600">
    <g transform="translate(336 350)">
      <rect width="157" height="44" rx="22" fill="#91D4E8" fill-opacity="0.10" stroke="#91D4E8" stroke-opacity="0.25"/>
      <circle cx="24" cy="22" r="5" fill="#91D4E8"/>
      <text x="40" y="29" fill="#DDF5FC">Native picker</text>
    </g>
    <g transform="translate(507 350)">
      <rect width="183" height="44" rx="22" fill="#91D4E8" fill-opacity="0.10" stroke="#91D4E8" stroke-opacity="0.25"/>
      <circle cx="24" cy="22" r="5" fill="#91D4E8"/>
      <text x="40" y="29" fill="#DDF5FC">Full MCP tools</text>
    </g>
    <g transform="translate(704 350)">
      <rect width="220" height="44" rx="22" fill="#91D4E8" fill-opacity="0.10" stroke="#91D4E8" stroke-opacity="0.25"/>
      <circle cx="24" cy="22" r="5" fill="#91D4E8"/>
      <text x="40" y="29" fill="#DDF5FC">No model API key</text>
    </g>
  </g>

  <text x="336" y="452" fill="#78909C" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">task · context · tools · streaming · compaction</text>

  <g transform="translate(980 112)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="500" height="336" rx="28" fill="url(#card)" stroke="#B4DDEA" stroke-opacity="0.16" stroke-width="2"/>
    <text x="32" y="48" fill="#7FA3B3" font-size="18" font-weight="650" letter-spacing="1.7">ACTIVE ROUTE</text>

    <g transform="translate(32 76)">
      <rect width="436" height="63" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="29" cy="31.5" r="8" fill="#A5DCEE"/>
      <text x="50" y="29" fill="#F0F7FA" font-size="20" font-weight="650">Codex task</text>
      <text x="50" y="49" fill="#8399A4" font-size="14">native context + tool lifecycle</text>
      <text x="374" y="38" fill="#83BFD6" font-size="18">01</text>
    </g>

    <path d="M250 143v23" stroke="#79B7CE" stroke-width="2" stroke-linecap="round"/>
    <path d="m245 162 5 6 5-6" fill="none" stroke="#79B7CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(32 166)">
      <rect width="436" height="63" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="29" cy="31.5" r="8" fill="#75B6CF"/>
      <text x="50" y="29" fill="#F0F7FA" font-size="20" font-weight="650">Native Gateway</text>
      <text x="50" y="49" fill="#8399A4" font-size="14">Responses + SSE routing</text>
      <text x="374" y="38" fill="#83BFD6" font-size="18">02</text>
    </g>

    <path d="M250 233v23" stroke="#79B7CE" stroke-width="2" stroke-linecap="round"/>
    <path d="m245 252 5 6 5-6" fill="none" stroke="#79B7CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(32 256)">
      <rect width="436" height="63" rx="16" fill="#7CC6E0" fill-opacity="0.075" stroke="#7CC6E0" stroke-opacity="0.16"/>
      <circle cx="29" cy="31.5" r="8" fill="#DDF6FF"/>
      <text x="50" y="29" fill="#F4FAFC" font-size="20" font-weight="650">ChatGPT Web</text>
      <text x="50" y="49" fill="#8FA6B0" font-size="14">Luna · Instant · High · Pro</text>
      <text x="374" y="38" fill="#A8DDF0" font-size="18">03</text>
    </g>
  </g>
</svg>
