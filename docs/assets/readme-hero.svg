<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Web for Codex</title>
  <desc id="desc">ChatGPT Web model routing inside the native Codex workflow, with task-bound sessions and MCP tools.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="1530" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121A2D"/>
      <stop offset="0.48" stop-color="#0B1322"/>
      <stop offset="1" stop-color="#08101A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="panel" x1="980" y1="96" x2="1494" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182337" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0D1624" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(260 120) rotate(32) scale(460 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1370 430) rotate(-145) scale(510 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#C7D7F3" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="40" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="40" fill="url(#grid)"/>
  <rect width="1600" height="560" rx="40" fill="url(#glowA)"/>
  <rect width="1600" height="560" rx="40" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1598" height="558" rx="39" fill="none" stroke="#C8D7EE" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(104 92)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g>
      <rect width="222" height="38" rx="19" fill="#0F2130" stroke="#5EE7F4" stroke-opacity="0.28"/>
      <circle cx="20" cy="19" r="5" fill="#67E8F9"/>
      <text x="34" y="25" fill="#B9F4F8" font-size="15" font-weight="700" letter-spacing="1.9">CODEX NATIVE BRIDGE</text>
    </g>

    <text x="0" y="112" fill="#F7FAFF" font-size="62" font-weight="760" letter-spacing="-2.2">ChatGPT Web</text>
    <text x="0" y="178" fill="url(#accent)" font-size="62" font-weight="760" letter-spacing="-2.2">for Codex</text>
    <text x="0" y="226" fill="#AAB8CB" font-size="24" font-weight="450">Keep the Codex surface. Add ChatGPT Web model routes.</text>

    <g transform="translate(0 270)" font-size="16" font-weight="650">
      <g>
        <rect width="174" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <circle cx="20" cy="21" r="4" fill="#67E8F9"/>
        <text x="33" y="27" fill="#DCE7F5">Native model picker</text>
      </g>
      <g transform="translate(186 0)">
        <rect width="186" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <circle cx="20" cy="21" r="4" fill="#7DD3FC"/>
        <text x="33" y="27" fill="#DCE7F5">MCP tool round-trip</text>
      </g>
      <g transform="translate(384 0)">
        <rect width="202" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <circle cx="20" cy="21" r="4" fill="#A78BFA"/>
        <text x="33" y="27" fill="#DCE7F5">Task-bound context</text>
      </g>
    </g>

    <g transform="translate(0 354)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
      <text x="0" y="0" fill="#6F8096">Responses</text>
      <circle cx="96" cy="-5" r="2.6" fill="#4B6177"/>
      <text x="110" y="0" fill="#6F8096">SSE streaming</text>
      <circle cx="244" cy="-5" r="2.6" fill="#4B6177"/>
      <text x="260" y="0" fill="#6F8096">Managed Chrome</text>
      <circle cx="420" cy="-5" r="2.6" fill="#4B6177"/>
      <text x="436" y="0" fill="#6F8096">Temporary Chat</text>
    </g>
  </g>

  <g transform="translate(932 82)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="556" height="396" rx="30" fill="url(#panel)" stroke="#B8C7E1" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="20" y="18" width="516" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.05"/>
    <circle cx="42" cy="36" r="5" fill="#34D399"/>
    <text x="56" y="42" fill="#A7B9CE" font-size="14" font-weight="700" letter-spacing="1.5">ROUTE ACTIVE</text>
    <text x="468" y="42" fill="#7F94AA" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">local</text>

    <g transform="translate(34 78)">
      <rect width="488" height="72" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <rect x="16" y="15" width="42" height="42" rx="12" fill="#22D3EE" fill-opacity="0.11" stroke="#67E8F9" stroke-opacity="0.22"/>
      <path d="M30 28h14v14H30zM26 32h4M44 32h4M37 24v4M37 42v4" fill="none" stroke="#A8F4FA" stroke-width="2" stroke-linecap="round"/>
      <text x="74" y="31" fill="#F2F7FC" font-size="19" font-weight="680">Codex task</text>
      <text x="74" y="52" fill="#8397AD" font-size="14">native UI · context · files · approvals</text>
      <text x="431" y="43" fill="#73889F" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">01</text>
    </g>

    <path d="M278 151v26" stroke="#5AAFC6" stroke-width="2" stroke-linecap="round"/>
    <path d="m273 173 5 6 5-6" fill="none" stroke="#5AAFC6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(34 180)">
      <rect width="488" height="72" rx="18" fill="#67E8F9" fill-opacity="0.045" stroke="#67E8F9" stroke-opacity="0.13"/>
      <rect x="16" y="15" width="42" height="42" rx="12" fill="#7DD3FC" fill-opacity="0.12" stroke="#7DD3FC" stroke-opacity="0.24"/>
      <path d="M29 31h16M29 37h16M33 25v18M41 25v18" fill="none" stroke="#C7EEFF" stroke-width="2" stroke-linecap="round"/>
      <text x="74" y="31" fill="#F4F9FD" font-size="19" font-weight="680">Native Gateway</text>
      <text x="74" y="52" fill="#8FA3B8" font-size="14">routing · streaming · compaction boundary</text>
      <text x="431" y="43" fill="#78B9CF" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">02</text>
    </g>

    <path d="M278 253v26" stroke="#7E83D8" stroke-width="2" stroke-linecap="round"/>
    <path d="m273 275 5 6 5-6" fill="none" stroke="#7E83D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(34 282)">
      <rect width="488" height="72" rx="18" fill="#A78BFA" fill-opacity="0.055" stroke="#A78BFA" stroke-opacity="0.16"/>
      <rect x="16" y="15" width="42" height="42" rx="12" fill="#A78BFA" fill-opacity="0.12" stroke="#C4B5FD" stroke-opacity="0.24"/>
      <circle cx="37" cy="36" r="10" fill="none" stroke="#DDD6FE" stroke-width="2"/>
      <path d="M27 36h20M37 26c3 3 5 6 5 10s-2 7-5 10M37 26c-3 3-5 6-5 10s2 7 5 10" fill="none" stroke="#DDD6FE" stroke-width="1.6" stroke-linecap="round"/>
      <text x="74" y="31" fill="#F6F3FF" font-size="19" font-weight="680">ChatGPT Web</text>
      <text x="74" y="52" fill="#9D9AB7" font-size="14">Luna · Instant · Medium · High · Extra High · Pro</text>
      <text x="431" y="43" fill="#B6A7F8" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">03</text>
    </g>

    <g transform="translate(391 151)">
      <path d="M0 0h86v128H0" fill="none" stroke="#526780" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 6"/>
      <rect x="18" y="43" width="88" height="42" rx="14" fill="#101B2A" stroke="#67E8F9" stroke-opacity="0.18"/>
      <text x="62" y="60" text-anchor="middle" fill="#8FA8BD" font-size="12" font-weight="700" letter-spacing="1">MCP</text>
      <text x="62" y="76" text-anchor="middle" fill="#C9D6E5" font-size="13">tools ↔ task</text>
    </g>
